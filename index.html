<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Snake.io style - JavaScript + HTML5 Canvas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0f0f1a;
      color: #e5e7eb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#game {
      width: min(100vw, 1200px);
      height: min(100vh, 800px);
      background: #0f0f1a;
      display: block;
    }
    .hint {
      position: absolute;
      inset: 0 0 auto 0;
      text-align: center;
      padding: 8px 12px;
      font-size: 12px;
      color: #a1a1aa;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div class="hint">Chuột để lái (M để chuyển sang phím mũi tên), Space: Boost, P: Tạm dừng, R: Chơi lại</div>
  </div>

  <script>
  // =========================
  // Config
  // =========================
  const BG_COLOR = "#0f0f1a";
  const PELLET_COLOR = "#ffd54f";
  const SNAKE_COLOR = "#6ee7b7";
  const SNAKE_OUTLINE = "#34d399";
  const TEXT_COLOR = "#e5e7eb";

  const PELLET_RADIUS = 4.0;
  const PELLET_COUNT = 120;

  const SNAKE_RADIUS = 10.0;
  const BASE_SPEED = 160.0;   // px/s
  const BOOST_SPEED = 260.0;  // px/s

  const TURN_RATE_MOUSE = 999.0; // rad/s (bám chuột)
  const TURN_RATE_KEYS = 3.2;    // rad/s

  const POINT_SPACING = 2.0;      // khoảng cách điểm thân (px)
  const INITIAL_LENGTH = 80.0;    // px
  const GROWTH_PER_PELLET = 40.0; // px

  const SELF_COLLISION_SKIP_DIST = 36.0;
  const SELF_COLLISION_DIST = SNAKE_RADIUS * 0.9;

  const MAX_DT = 0.05;

  // =========================
  // Helpers
  // =========================
  const TAU = Math.PI * 2;
  function angleLerp(current, target, maxDelta) {
    let diff = (target - current + Math.PI) % (TAU) - Math.PI;
    if (diff > maxDelta) diff = maxDelta;
    else if (diff < -maxDelta) diff = -maxDelta;
    return current + diff;
  }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.hypot(dx, dy);
  }

  // =========================
  // Game State
  // =========================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let cssW = 0, cssH = 0, dpr = 1;
  function resize() {
    const rect = canvas.getBoundingClientRect();
    cssW = rect.width;
    cssH = rect.height;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(cssW * dpr));
    canvas.height = Math.max(1, Math.floor(cssH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    width = cssW;
    height = cssH;
  }
  window.addEventListener("resize", resize);

  let width = 0, height = 0;
  resize();

  // Inputs
  let mouseX = width * 0.5, mouseY = height * 0.5;
  let turnLeft = false, turnRight = false, boost = false;
  let useMouse = true;
  let paused = false, gameOver = false;

  canvas.addEventListener("mousemove", e => {
    // offsetX/Y đã là theo CSS px
    mouseX = e.offsetX;
    mouseY = e.offsetY;
  });

  document.addEventListener("keydown", e => {
    const key = (e.key || "").toLowerCase();
    if (key === "arrowleft" || key === "a") { turnLeft = true; e.preventDefault(); }
    else if (key === "arrowright" || key === "d") { turnRight = true; e.preventDefault(); }
    else if (key === " " || key === "spacebar") { boost = true; e.preventDefault(); }
    else if (key === "m") { useMouse = !useMouse; }
    else if (key === "p") { paused = !paused; }
    else if (key === "r") { resetGame(); }
  });
  document.addEventListener("keyup", e => {
    const key = (e.key || "").toLowerCase();
    if (key === "arrowleft" || key === "a") { turnLeft = false; e.preventDefault(); }
    else if (key === "arrowright" || key === "d") { turnRight = false; e.preventDefault(); }
    else if (key === " " || key === "spacebar") { boost = false; e.preventDefault(); }
  });

  // Snake
  let headX = 0, headY = 0, angle = 0;
  let bodyPoints = [];
  let maxLengthPx = INITIAL_LENGTH;
  let score = 0;

  // Pellets
  const pellets = [];

  function resetGame() {
    headX = width * 0.5;
    headY = height * 0.5;
    angle = 0;
    bodyPoints = [];
    const need = Math.max(1, Math.floor(INITIAL_LENGTH / POINT_SPACING));
    for (let i = 0; i < need; i++) {
      bodyPoints.push([headX - (need - i) * POINT_SPACING, headY]);
    }
    maxLengthPx = INITIAL_LENGTH;
    score = 0;
    pellets.length = 0;
    for (let i = 0; i < PELLET_COUNT; i++) addPellet();
    paused = false;
    gameOver = false;
  }

  function addPellet() {
    for (let tries = 0; tries < 100; tries++) {
      const x = 20 + Math.random() * Math.max(1, width - 40);
      const y = 20 + Math.random() * Math.max(1, height - 40);
      if (dist(x, y, headX, headY) > 80) {
        pellets.push([x, y]);
        return;
      }
    }
    // fallback
    pellets.push([Math.random() * width, Math.random() * height]);
  }

  function wrapPosition(x, y) {
    let wrapped = false;
    if (x < 0) { x += width; wrapped = true; }
    else if (x > width) { x -= width; wrapped = true; }
    if (y < 0) { y += height; wrapped = true; }
    else if (y > height) { y -= height; wrapped = true; }
    return [x, y, wrapped];
  }

  function appendAlongPath(toX, toY, wrapped=false) {
    if (bodyPoints.length === 0) { bodyPoints.push([toX, toY]); return; }
    const last = bodyPoints[bodyPoints.length - 1];
    if (wrapped) {
      bodyPoints.push([toX, toY]);
    } else {
      const dx = toX - last[0];
      const dy = toY - last[1];
      const d = Math.hypot(dx, dy);
      if (d === 0) return;
      const steps = Math.floor(d / POINT_SPACING);
      if (steps === 0) {
        bodyPoints.push([toX, toY]);
      } else {
        const ux = dx / d, uy = dy / d;
        for (let i = 1; i <= steps; i++) {
          bodyPoints.push([last[0] + ux * POINT_SPACING * i, last[1] + uy * POINT_SPACING * i]);
        }
        if (d - steps * POINT_SPACING > 1e-6) {
          bodyPoints.push([toX, toY]);
        }
      }
    }
    const maxPts = Math.max(1, Math.floor(maxLengthPx / POINT_SPACING));
    while (bodyPoints.length > maxPts) bodyPoints.shift();
  }

  function checkPelletCollisions() {
    const rr = (SNAKE_RADIUS + PELLET_RADIUS) ** 2;
    let eaten = 0;
    for (let i = pellets.length - 1; i >= 0; i--) {
      const [px, py] = pellets[i];
      const dx = headX - px, dy = headY - py;
      if (dx*dx + dy*dy <= rr) {
        pellets.splice(i, 1);
        eaten++;
      }
    }
    if (eaten > 0) {
      score += eaten;
      maxLengthPx += GROWTH_PER_PELLET * eaten;
      for (let i = 0; i < eaten; i++) addPellet();
    }
  }

  function checkSelfCollision() {
    if (bodyPoints.length === 0) return false;
    const skipPts = Math.floor(SELF_COLLISION_SKIP_DIST / POINT_SPACING);
    const upto = Math.max(0, bodyPoints.length - skipPts);
    const thr2 = (SELF_COLLISION_DIST) ** 2;
    for (let i = 0; i < upto; i++) {
      const [x, y] = bodyPoints[i];
      const dx = headX - x, dy = headY - y;
      if (dx*dx + dy*dy <= thr2) return true;
    }
    return false;
  }

  function step(dt) {
    // Rotate
    if (useMouse) {
      const target = Math.atan2(mouseY - headY, mouseX - headX);
      angle = angleLerp(angle, target, TURN_RATE_MOUSE * dt);
    } else {
      if (turnLeft && !turnRight) angle -= TURN_RATE_KEYS * dt;
      else if (turnRight && !turnLeft) angle += TURN_RATE_KEYS * dt;
    }
    // Move
    const speed = boost ? BOOST_SPEED : BASE_SPEED;
    const vx = Math.cos(angle) * speed * dt;
    const vy = Math.sin(angle) * speed * dt;
    let newX = headX + vx, newY = headY + vy;
    const wr = wrapPosition(newX, newY);
    newX = wr[0]; newY = wr[1];
    appendAlongPath(newX, newY, wr[2]);
    headX = newX; headY = newY;

    checkPelletCollisions();
    if (checkSelfCollision()) gameOver = true;
  }

  function draw() {
    const w = width, h = height;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, w, h);

    // Pellets
    ctx.fillStyle = PELLET_COLOR;
    for (const [px, py] of pellets) {
      ctx.beginPath();
      ctx.arc(px, py, PELLET_RADIUS, 0, TAU);
      ctx.fill();
    }

    // Snake (body path)
    if (bodyPoints.length >= 1) {
      ctx.lineWidth = SNAKE_RADIUS * 2;
      ctx.strokeStyle = SNAKE_COLOR;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      const pts = bodyPoints.concat([[headX, headY]]);
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const [x, y] = pts[i];
        if (i === 0) { ctx.moveTo(x, y); continue; }
        const [px, py] = pts[i - 1];
        // nếu nhảy xa (do wrap), bắt đầu subpath mới
        if (Math.abs(x - px) > w * 0.5 || Math.abs(y - py) > h * 0.5) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.stroke();
    }

    // Head outline + fill
    const r = SNAKE_RADIUS;
    ctx.lineWidth = 2;
    ctx.strokeStyle = SNAKE_OUTLINE;
    ctx.beginPath();
    ctx.arc(headX, headY, r, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = SNAKE_COLOR;
    ctx.beginPath();
    ctx.arc(headX, headY, r - 2, 0, TAU);
    ctx.fill();

    // Eye
    const ex = headX + Math.cos(angle) * (r * 0.5);
    const ey = headY + Math.sin(angle) * (r * 0.5);
    ctx.fillStyle = "#111827";
    ctx.beginPath();
    ctx.arc(ex, ey, 2, 0, TAU);
    ctx.fill();

    // HUD
    const steerText = useMouse ? "Mouse" : "Arrows";
    const boostText = boost ? "ON" : "OFF";
    const status = `Score: ${score}  |  Control: ${steerText} (M)  |  Boost: ${boostText} (Space)  |  Pause: P  |  Reset: R`;
    ctx.fillStyle = TEXT_COLOR;
    ctx.font = "12px Consolas, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(status, w * 0.5, 8);

    if (paused) {
      ctx.fillStyle = "#93c5fd";
      ctx.font = "28px Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("PAUSED\nPress P to resume", w * 0.5, h * 0.5);
    }
    if (gameOver) {
      ctx.fillStyle = "#fca5a5";
      ctx.font = "28px Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("GAME OVER\nPress R to restart", w * 0.5, h * 0.5);
    }

    ctx.restore();
  }

  // =========================
  // Start
  // =========================
  resetGame();
  let lastTs = 0;
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    if (dt > MAX_DT) dt = MAX_DT;
    lastTs = ts;

    if (!paused && !gameOver) step(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  </script>
</body>
</html>
